<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#09090b" />
<title>快速計算台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<style>
  :root{--bg:#09090b;--line:#27272a;--txt:#e4e4e7;--dim:#71717a;--dim2:#52525b;--amber:#fbbf24;--green:#34d399;--red:#fb7185;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:16px;padding-bottom:40px;}
  .wrap{max-width:520px;margin:0 auto;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  h1{font-size:16px;color:var(--amber);margin:0;font-family:ui-monospace,monospace;letter-spacing:-.02em;}
  .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
  .head span{font-size:11px;color:var(--dim2);}
  .card{border:1px solid var(--line);background:rgba(24,24,27,.5);border-radius:10px;padding:12px;margin-bottom:14px;}
  .card .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(251,191,36,.9);margin-bottom:8px;}
  label .lb{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);}
  .inp{margin-top:3px;display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:5px;}
  .inp:focus-within{border-color:rgba(251,191,36,.6);}
  .inp input{width:100%;background:transparent;border:0;color:var(--txt);padding:9px 8px;font-size:15px;outline:none;font-family:ui-monospace,monospace;}
  .inp .sfx{padding:0 7px;font-size:11px;color:var(--dim);}
  select{margin-top:3px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:5px;padding:8px 6px;font-size:15px;font-family:ui-monospace,monospace;}
  .grid{display:grid;gap:8px;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;} .g4{grid-template-columns:repeat(4,1fr);}
  .exprow{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:5px;}
  .exprow input{width:100%;background:transparent;border:0;color:var(--txt);padding:11px 10px;font-size:15px;outline:none;font-family:ui-monospace,monospace;}
  .exprow input::placeholder{color:var(--dim2);}
  .btn{border:0;border-radius:5px;font-weight:700;font-size:13px;padding:8px 12px;background:var(--amber);color:#09090b;margin:4px;}
  .btng{border:1px solid rgba(251,191,36,.5);background:rgba(251,191,36,.1);color:#fcd34d;border-radius:5px;font-size:12px;padding:9px 10px;}
  .live{margin-top:6px;min-height:20px;font-family:ui-monospace,monospace;font-size:15px;}
  .live.ok{color:var(--green);} .live.err{color:var(--red);}
  .hist{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px;}
  .hist button{display:flex;justify-content:space-between;gap:12px;background:transparent;border:0;color:var(--dim);font-family:ui-monospace,monospace;font-size:12px;text-align:left;padding:3px 4px;border-radius:4px;}
  .hist button:active{background:rgba(39,39,42,.6);}
  .hist .r{color:#d4d4d8;flex-shrink:0;}
  .out{background:var(--bg);border-radius:5px;padding:8px 10px;font-family:ui-monospace,monospace;}
  .out .lb{font-size:10px;color:var(--dim);} .out .v{font-size:17px;font-weight:700;color:var(--green);}
  .tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .tabs button{border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12px;padding:4px 10px;border-radius:5px;}
  .tabs button.on{background:var(--amber);color:#09090b;border-color:var(--amber);}
  .note{font-size:10px;color:var(--dim2);margin-top:6px;}
  .foot{text-align:center;font-size:10px;color:#3f3f46;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="display:inline-block;color:#71717a;font-size:12px;text-decoration:none;margin-bottom:8px;">← 工具選單</a>
  <div class="head"><h1>快速計算台</h1><span>運算式 · 匯率 · 複利 · %</span></div>

  <div class="card">
    <div class="t">運算式（支援單位與 %）</div>
    <div class="exprow">
      <input id="expr" placeholder="5 km to mile · 1200*(1+8%) · sqrt(2)^10" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="eq">=</button>
    </div>
    <div class="live ok" id="live"></div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="card">
    <div class="t">匯率換算</div>
    <div class="grid g4">
      <label style="grid-column:span 2"><span class="lb">金額</span><div class="inp"><input id="amt" type="number" value="100"></div></label>
      <label><span class="lb">從</span><select id="from"></select></label>
      <label><span class="lb">到</span><select id="to"></select></label>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end;margin-top:8px;">
      <label style="flex:1"><span class="lb" id="ratelb">匯率</span><div class="inp"><input id="rate" type="number" value="32.5"></div></label>
      <button class="btng" id="getfx">抓即時匯率</button>
    </div>
    <div class="out" style="margin-top:8px"><span class="v" id="fxout">—</span> <span style="color:var(--dim);font-size:13px" id="fxto">TWD</span></div>
    <div class="note" id="fxnote">可按鈕抓即時匯率，或手動輸入</div>
  </div>

  <div class="card">
    <div class="t">複利 / 單利</div>
    <div class="tabs" id="itabs"><button data-i="c" class="on">複利</button><button data-i="s">單利</button></div>
    <div class="grid g4">
      <label><span class="lb">本金</span><div class="inp"><input id="pr" type="number" value="1000000"></div></label>
      <label><span class="lb">年利率</span><div class="inp"><input id="ar" type="number" value="5"><span class="sfx">%</span></div></label>
      <label><span class="lb">年數</span><div class="inp"><input id="yr" type="number" value="10"></div></label>
      <label id="cfwrap"><span class="lb">複利頻率</span><select id="cf"><option value="1">每年</option><option value="12" selected>每月</option><option value="365">每日</option><option value="0">連續</option></select></label>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div class="out"><div class="lb">期末總額</div><div class="v" id="fv">—</div></div>
      <div class="out"><div class="lb">利息</div><div class="v" style="color:var(--amber)" id="intv">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="t">百分比工具</div>
    <div class="tabs" id="ptabs"><button data-p="disc" class="on">折扣後</button><button data-p="markup">加成後</button><button data-p="growth">成長率</button><button data-p="share">佔比</button></div>
    <div class="grid g3" style="align-items:end">
      <label><span class="lb" id="pl0">原價</span><div class="inp"><input id="pa" type="number"></div></label>
      <label><span class="lb" id="pl1">折扣%</span><div class="inp"><input id="pb" type="number"></div></label>
      <div class="out"><div class="lb" id="pl2">折後價</div><div class="v" id="pcout">—</div></div>
    </div>
  </div>

  <div class="foot">全部本地計算（匯率需連網抓取）。</div>
</div>

<script>
const $=id=>document.getElementById(id);
const nf=(v,d=2)=>isFinite(v)?Number(v).toLocaleString("en-US",{maximumFractionDigits:d}):"—";

// ---- expression ----
function evalExpr(){
  const s=$("expr").value.trim();
  const el=$("live");
  if(!s){el.textContent="";return null;}
  try{const r=math.evaluate(s);const out=math.format(r,{precision:10});el.className="live ok";el.textContent="= "+out;return out;}
  catch(e){el.className="live err";el.textContent=e.message;return null;}
}
$("expr").addEventListener("input",evalExpr);
const histArr=[];
function pushHist(){const s=$("expr").value.trim();const out=evalExpr();if(s&&out!==null){histArr.unshift({e:s,r:out});histArr.splice(12);renderHist();$("expr").value="";evalExpr();}}
$("eq").addEventListener("click",pushHist);
$("expr").addEventListener("keydown",e=>{if(e.key==="Enter")pushHist();});
function renderHist(){$("hist").innerHTML=histArr.map((h,i)=>'<button data-i="'+i+'"><span>'+h.e+'</span><span class="r">= '+h.r+'</span></button>').join("");}
$("hist").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("expr").value=histArr[b.dataset.i].e;evalExpr();$("expr").focus();});

// ---- fx ----
const CURS=["TWD","USD","JPY","EUR","CNY","HKD","GBP","KRW","AUD"];
$("from").innerHTML=CURS.map(c=>'<option '+(c==="USD"?"selected":"")+'>'+c+'</option>').join("");
$("to").innerHTML=CURS.map(c=>'<option '+(c==="TWD"?"selected":"")+'>'+c+'</option>').join("");
function fxRender(){const amt=parseFloat($("amt").value)||0;const rate=parseFloat($("rate").value)||0;$("fxout").textContent=nf(amt*rate,2);$("fxto").textContent=$("to").value;$("ratelb").textContent="匯率 1 "+$("from").value+"=";}
["amt","rate","from","to"].forEach(id=>$(id).addEventListener("input",fxRender));
$("getfx").addEventListener("click",async()=>{
  const from=$("from").value,to=$("to").value;$("getfx").textContent="抓取中…";$("fxnote").textContent="";
  try{const res=await fetch("https://open.er-api.com/v6/latest/"+from);const d=await res.json();const r=d&&d.rates&&d.rates[to];if(!r)throw 0;
    $("rate").value=Number(r.toPrecision(6));$("fxnote").style.color="var(--dim2)";$("fxnote").textContent="即時匯率 · "+((d.time_last_update_utc||"").slice(5,22)||"已更新");fxRender();}
  catch(e){$("fxnote").style.color="var(--red)";$("fxnote").textContent="抓取失敗，請手動輸入匯率";}
  $("getfx").textContent="抓即時匯率";
});

// ---- interest ----
let imode="c";
function iRender(){const P=parseFloat($("pr").value)||0,R=(parseFloat($("ar").value)||0)/100,T=parseFloat($("yr").value)||0,n=parseFloat($("cf").value);
  let fv; if(imode==="s")fv=P*(1+R*T); else if(n===0)fv=P*Math.exp(R*T); else fv=P*Math.pow(1+R/n,n*T);
  $("fv").textContent=nf(fv,0);$("intv").textContent=nf(fv-P,0);}
["pr","ar","yr","cf"].forEach(id=>$(id).addEventListener("input",iRender));
$("itabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;imode=b.dataset.i;
  document.querySelectorAll("#itabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("cfwrap").style.visibility=imode==="s"?"hidden":"visible";iRender();});

// ---- percent ----
let pmode="disc";
const PLBL={disc:["原價","折扣%","折後價"],markup:["成本","加成%","售價"],growth:["舊值","新值","成長率"],share:["部分","總量","佔比"]};
function pRender(){const a=parseFloat($("pa").value),b=parseFloat($("pb").value);let o="—";
  if(isFinite(a)&&isFinite(b)){ if(pmode==="disc")o=nf(a*(1-b/100),2); else if(pmode==="markup")o=nf(a*(1+b/100),2); else if(pmode==="growth")o=nf((b-a)/a*100,2)+" %"; else o=nf(a/b*100,2)+" %";}
  $("pcout").textContent=o;}
["pa","pb"].forEach(id=>$(id).addEventListener("input",pRender));
$("ptabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;pmode=b.dataset.p;
  document.querySelectorAll("#ptabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("pl0").textContent=PLBL[pmode][0];$("pl1").textContent=PLBL[pmode][1];$("pl2").textContent=PLBL[pmode][2];pRender();});

fxRender();iRender();
</script>
</body>
</html>
