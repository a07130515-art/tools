<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>充電站・統測電機類每日練習</title>
<style>
:root{
  --bg:#eef1f8; --card:#ffffff; --ink:#182338; --sub:#5c667d;
  --line:#e3e7f1; --blue:#2f6be6; --blue-d:#1f4fbf;
  --amber:#f6a62b; --amber-d:#d98407;
  --green:#12a05f; --red:#e5533c;
  --shadow:0 6px 22px rgba(24,35,56,.08);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:84px;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 0}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.5px}
.spark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#5b8bff);display:grid;place-items:center;color:#fff;font-size:15px}
.count{background:var(--card);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);text-align:center;line-height:1.15}
.count b{font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.count span{display:block;font-size:11px;color:var(--sub)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--sub);text-transform:uppercase}

/* battery signature */
.batt-wrap{display:flex;align-items:center;gap:16px;margin:6px 0 4px}
.batt{position:relative;width:96px;height:150px;border:5px solid var(--ink);border-radius:14px;overflow:hidden;flex:0 0 auto;background:#f3f5fb}
.batt::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:34px;height:11px;background:var(--ink);border-radius:5px 5px 0 0}
.seg{position:absolute;left:0;right:0;transition:background .5s, box-shadow .5s;background:#e7ebf5;border-top:3px solid #f3f5fb}
.seg.on{background:linear-gradient(180deg,#ffcf6e,var(--amber));box-shadow:inset 0 0 18px rgba(217,132,7,.35)}
.seg.s3{top:0;height:33.4%}.seg.s2{top:33.4%;height:33.3%}.seg.s1{top:66.7%;height:33.3%}
.batt-txt h2{font-size:22px}
.batt-txt .pct{font-size:40px;font-weight:800;color:var(--amber-d);font-variant-numeric:tabular-nums;line-height:1}
.batt-txt p{font-size:13px;color:var(--sub);margin-top:4px}

/* gates */
.gate{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-top:10px;width:100%;text-align:left;transition:.15s;background:var(--card)}
.gate:active{transform:scale(.99)}
.gate .num{width:30px;height:30px;border-radius:9px;background:#eaf0ff;color:var(--blue);font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.gate .g-body{flex:1}
.gate .g-body b{font-size:15.5px}
.gate .g-body span{display:block;font-size:12.5px;color:var(--sub)}
.gate .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px}
.gate.done{border-color:#bfe6d1;background:#f2fbf6}
.gate.done .tick{background:var(--green);border-color:var(--green)}
.gate.done .num{background:#e3f6ec;color:var(--green)}

/* mini stat row */
.mini{display:flex;gap:10px;margin-bottom:14px}
.mini .m{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}
.mini .m b{font-size:22px;font-variant-numeric:tabular-nums}
.mini .m span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}

/* timer */
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .disp{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* buttons */
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:14px;text-align:center;box-shadow:0 6px 16px rgba(47,107,230,.28)}
.btn:active{background:var(--blue-d)}
.btn.amber{background:var(--amber);box-shadow:0 6px 16px rgba(246,166,43,.3)}
.btn.amber:active{background:var(--amber-d)}
.btn.ghost{background:#eef2fb;color:var(--blue);box-shadow:none}
.btn.sm{font-size:14px;padding:11px}

/* flashcard */
.flip{perspective:1200px;margin-bottom:14px}
.flip-inner{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face .tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;color:var(--blue);background:#eaf0ff;padding:3px 9px;border-radius:999px}
.face .q{font-size:21px;font-weight:700}
.face.back{transform:rotateY(180deg);background:#fbfcff}
.face.back .a{font-size:22px;font-weight:800;color:var(--ink)}
.face.back .mn{margin-top:12px;font-size:14px;color:var(--amber-d);background:#fff6e6;padding:9px 12px;border-radius:12px;display:inline-block}
.hint{text-align:center;font-size:12.5px;color:var(--sub);margin:-4px 0 12px}
.rowbtn{display:flex;gap:10px}
.rowbtn .btn{flex:1}
.btn.no{background:#fdece8;color:var(--red);box-shadow:none}
.btn.yes{background:#e5f7ee;color:var(--green);box-shadow:none}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:10px;font-size:15.5px;transition:.12s}
.opt:active{transform:scale(.995)}
.opt .k{font-weight:800;color:var(--blue);margin-right:8px}
.opt.correct{border-color:var(--green);background:#f0fbf5}
.opt.wrong{border-color:var(--red);background:#fdf0ee}
.opt.correct .k{color:var(--green)}.opt.wrong .k{color:var(--red)}
.solve{background:#f4f7ff;border-radius:13px;padding:13px 15px;margin-top:12px;font-size:14px}
.solve b{color:var(--blue)}

/* progress bars */
.prog{margin-top:12px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.prog .lab span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:9px;background:#e9edf7;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6a9bff);border-radius:999px;transition:width .4s}

/* selects / inputs */
label.fld{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
select,input,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--sub)}
.pill.sel{background:var(--blue);color:#fff;border-color:var(--blue)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--sub);font-weight:600}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--blue)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}
.big-emoji{font-size:40px;display:block;margin-bottom:8px}
.celebrate{text-align:center;padding:10px 0}
.celebrate .big-emoji{font-size:52px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:40;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.sec-title{font-size:17px;font-weight:800;margin:4px 2px 10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="spark">⚡</span>充電站</div>
    <div class="count"><b id="daysLeft">–</b><span>天後統測</span></div>
  </div>
  <div id="app"></div>
</div>

<div class="nav">
  <button data-v="today" class="on"><span class="ic">🔋</span>今天</button>
  <button data-v="cards"><span class="ic">🗂️</span>記憶卡</button>
  <button data-v="quiz"><span class="ic">✏️</span>練習</button>
  <button data-v="wrong"><span class="ic">🔁</span>錯題</button>
  <button data-v="mock"><span class="ic">📝</span>模考</button>
  <button data-v="more"><span class="ic">⚙️</span>更多</button>
</div>
<div class="toast" id="toast"></div>

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmtNum(n){n=Math.round(n*100)/100;return n.toString();}
function opts4(correct,wrongs,unit){
  unit=unit||""; correct=Math.round(correct*100)/100;
  const cl=(a,b)=>Math.abs(a-b)<0.005;
  let vals=[correct];
  for(const w of (wrongs||[])){ if(vals.length>=4)break; const wr=Math.round(w*100)/100; if(wr>0 && !vals.some(v=>cl(v,wr))) vals.push(wr); }
  let g=0; while(vals.length<4 && g++<60){ const f=pick([0.5,2,1.5,0.25,3,0.75,4,1.25]); const w=Math.round(correct*f*100)/100; if(w>0 && !vals.some(v=>cl(v,w))) vals.push(w); }
  vals=shuffleArr(vals);
  return {opt:vals.map(v=>fmtNum(v)+unit), ans:vals.indexOf(correct)};
}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function sampleN(arr,n){return shuffleArr(arr).slice(0,n);}
function ratioOpts(rn,rd){
  const g0=gcd(rn,rd); rn/=g0; rd/=g0;
  const cand=[[rd,rn],[rn*rd,1],[1,rn*rd],[rn+rd,1],[rn,rd*2],[rn*2,rd]];
  const seen=new Set([rn+":"+rd]); const opt=[rn+":"+rd];
  for(const [a,b] of cand){ if(opt.length>=4)break; const g=gcd(a,b),k=(a/g)+":"+(b/g); if(!seen.has(k)){seen.add(k);opt.push(k);} }
  let guard=0; while(opt.length<4&&guard++<30){ const a=ri(1,6),b=ri(1,6),g=gcd(a,b),k=(a/g)+":"+(b/g); if(!seen.has(k)){seen.add(k);opt.push(k);} }
  const sh=shuffleArr(opt); return {opt:sh,ans:sh.indexOf(rn+":"+rd)};
}

    const f=pick(pool.f), ts=sampleN(pool.t,3).map(x=>x[0]), opt=shuffleArr([f,...ts]);

 {sub:"基本電學",topic:"分流定則",make(){const pr=pick([[3,6,9],[2,2,8],[4,4,10],[6,3,9],[5,5,10],[2,6,8],[4,12,8]]),a=pr[0],b=pr[1],It=pr[2],Ia=Math.round(It*b/(a+b)*100)/100;return {q:`總電流 ${It}A 進入 ${a}Ω 與 ${b}Ω 並聯,流過 ${a}Ω 的電流?`,sol:`分流取對面:${It}×${b}/(${a}+${b})=${Ia}A`,...opts4(Ia,[Math.round(It*a/(a+b)*100)/100,It/2,It],"A")};}},
 {sub:"基本電學",topic:"電功率",make(){const V=pick([10,12,20,50,110,100]),I=pick([2,3,4,5]),P=V*I;return {q:`電壓 ${V}V、電流 ${I}A,功率?`,sol:`P=VI=${V}×${I}=${P}W`,...opts4(P,[V+I,Math.round(V/I),P*2],"W")};}},
 {sub:"基本電學",topic:"電功率",make(){const I=pick([2,3,4,5]),R=pick([2,5,10,20]),P=I*I*R;return {q:`電流 ${I}A 通過 ${R}Ω,消耗功率?`,sol:`P=I²R=${I}²×${R}=${P}W`,...opts4(P,[I*R,I*R*2,R],"W")};}},
 {sub:"基本電學",topic:"度電計算",make(){const P=pick([100,200,500,1000,60,40,1500]),t=pick([2,3,4,5,8,10]),d=Math.round(P*t/1000*1000)/1000;return {q:`${P}W 的電器用 ${t} 小時,耗幾度電?`,sol:`度=(W×h)/1000=(${P}×${t})/1000=${d} 度`,...opts4(d,[P*t,d*10,P*t/100]," 度")};}},
 {sub:"基本電學",topic:"電荷",make(){const I=pick([0.5,1,2,3,4]),t=pick([2,3,4,5,10]),Q=Math.round(I*t*100)/100;return {q:`電流 ${I}A 流過 ${t} 秒,電荷?`,sol:`Q=It=${I}×${t}=${Q}C`,...opts4(Q,[I+t,Q*2,t]," C")};}},
 {sub:"基本電學",topic:"色碼",make(){const d1=ri(1,9),d2=ri(0,9),m=ri(0,4),val=(d1*10+d2)*Math.pow(10,m);return {q:`色碼「${CB[d1]}${CB[d2]}${CB[m]}」的電阻值?`,sol:`${CB[d1]}=${d1}、${CB[d2]}=${d2}、${CB[m]}=×10^${m} → ${d1*10+d2}×${Math.pow(10,m)} = ${val}Ω`,...opts4(val,[(d1*10+d2)*Math.pow(10,m+1),(d1*10+d2),(d1*10+d2)*Math.pow(10,Math.max(0,m-1))],"Ω")};}},
 {sub:"基本電學",topic:"交流有效值",make(){const peak=pick([10,20,100,200,50,155]),rms=Math.round(peak*0.707*10)/10;return {q:`交流峰值 ${peak}V,有效值約?`,sol:`RMS=峰值×0.707=${peak}×0.707≈${rms}V`,...opts4(rms,[peak,Math.round(peak*1.414*10)/10,peak/2],"V")};}},
 {sub:"基本電學",topic:"頻率週期",make(){const pr=pick([[20,50],[10,100],[5,200],[25,40],[50,20],[2,500]]),Tms=pr[0],f=pr[1];return {q:`交流週期 ${Tms}ms,頻率多少?`,sol:`f=1/T=1/${Tms/1000}s=${f}Hz`,...opts4(f,[Tms,f*2,Math.round(1000/Tms/2)],"Hz")};}},
 {sub:"電工機械",topic:"變壓器",make(){const pr=pick([[400,100,220],[200,50,100],[100,300,110],[500,100,220],[240,60,120],[100,200,60]]),N1=pr[0],N2=pr[1],V1=pr[2],V2=Math.round(V1*N2/N1*100)/100;return {q:`變壓器一次 ${N1} 匝、二次 ${N2} 匝,一次 ${V1}V,二次電壓?`,sol:`V2=V1×N2/N1=${V1}×${N2}/${N1}=${V2}V`,...opts4(V2,[Math.round(V1*N1/N2*100)/100,V1,V1/2],"V")};}},
 {sub:"電工機械",topic:"同步轉速",make(){const f=pick([50,60]),P=pick([2,4,6,8]),Ns=120*f/P;return {q:`頻率 ${f}Hz、${P} 極三相感應機,同步轉速?`,sol:`Ns=120f/P=120×${f}/${P}=${Ns} rpm`,...opts4(Ns,[60*f/P,120*f*P,Math.round(120*P/f)]," rpm")};}},
 {sub:"電工機械",topic:"轉差率",make(){const f=pick([50,60]),P=pick([2,4]),Ns=120*f/P,s=pick([2,3,4,5]),Nr=Math.round(Ns*(1-s/100)),S=Math.round((Ns-Nr)/Ns*1000)/10;return {q:`同步轉速 ${Ns}、實際 ${Nr} rpm,轉差率?`,sol:`S=(Ns−Nr)/Ns=(${Ns}−${Nr})/${Ns}≈${S}%`,...opts4(S,[Math.round(Nr/Ns*1000)/10,S*2,100-S],"%")};}},
 {sub:"電子學",topic:"二極體電流",make(){const Vs=pick([5,10,12,15,20]),R=pick([1,2,4,5,10]),I=Math.round((Vs-0.7)/R*100)/100;return {q:`${Vs}V 電源串聯 ${R}kΩ 與一個矽二極體(順向 0.7V),電流約?`,sol:`I=(Vs−0.7)/R=(${Vs}−0.7)/${R}k≈${I}mA`,...opts4(I,[Math.round(Vs/R*100)/100,Math.round((Vs+0.7)/R*100)/100,R],"mA")};}},
 {sub:"電子學",topic:"分壓偏壓",make(){const s=pick([[12,10,2,2],[15,10,5,5],[12,8,4,4],[10,6,6,5],[12,20,10,4],[20,15,5,5],[12,30,10,3]]),Vcc=s[0],R1=s[1],R2=s[2],VB=s[3];return {q:`Vcc=${Vcc}V,分壓 R1=${R1}kΩ、R2=${R2}kΩ,基極電壓 VB?`,sol:`VB=Vcc×R2/(R1+R2)=${Vcc}×${R2}/(${R1}+${R2})=${VB}V`,...opts4(VB,[Math.round(Vcc*R1/(R1+R2)*100)/100,Vcc/2,Vcc],"V")};}},
 {sub:"電子學",topic:"電晶體增益",make(){const b=pick([50,100,150,200]),Ib=pick([10,20,40,50]),Ic=Math.round(b*Ib/1000*100)/100;return {q:`β=${b}、Ib=${Ib}µA,集極電流 Ic 約?`,sol:`Ic=β×Ib=${b}×${Ib}µA=${Ic}mA`,...opts4(Ic,[Math.round(Ib/b*100)/100,Ic*2,b/Ib],"mA")};}},
 {sub:"電子學",topic:"射極電流",make(){const Ic=pick([1,2,3,4,5]),Ib=pick([10,20,40,50]),Ie=Math.round((Ic+Ib/1000)*100)/100;return {q:`Ic=${Ic}mA、Ib=${Ib}µA,射極電流 Ie?`,sol:`Ie=Ic+Ib=${Ic}+${Ib/1000}=${Ie}mA`,...opts4(Ie,[Math.round((Ic-Ib/1000)*100)/100,Ic,Ib],"mA")};}},
 {sub:"電子學",topic:"電壓增益",make(){const Vin=pick([5,10,20,50]),Av=pick([10,20,50,100]),Vout=Vin*Av;return {q:`輸入 ${Vin}mV、輸出 ${Vout}mV,電壓增益 Av?`,sol:`Av=Vout/Vin=${Vout}/${Vin}=${Av} 倍`,...opts4(Av,[Vout,Vin,Av*2]," 倍")};}},
 {sub:"電子學",topic:"增益分貝",make(){const s=pick([[10,20],[100,40],[1000,60]]),Av=s[0],dB=s[1];return {q:`電壓增益 ${Av} 倍,等於幾 dB?`,sol:`dB=20·log(Av)=20·log(${Av})=${dB} dB`,...opts4(dB,[Av,dB+20,dB*1.5]," dB")};}},
 {sub:"電子學",topic:"邏輯閘運算",make(){const A=ri(0,1),B=ri(0,1),g=pick(["AND","OR","NAND","NOR","XOR"]);let o;if(g==="AND")o=A&B;else if(g==="OR")o=A|B;else if(g==="NAND")o=1-(A&B);else if(g==="NOR")o=1-(A|B);else o=A^B;return {q:`A=${A}、B=${B},經過 ${g} 閘,輸出?`,sol:`${g}:輸入 ${A}、${B} → 輸出 ${o}`,opt:["0","1"],ans:o};}},
 {sub:"基本電學",topic:"電阻比較",make(){let la,Aa;do{la=pick([2,3,4]);Aa=pick([2,3]);}while(la===Aa&&Math.random()<.5);const useD=Math.random()<0.5;const den=useD?Aa*Aa:Aa;const r=ratioOpts(la,den);return {q:`同材料兩導線,甲長度為乙的 ${la} 倍、甲${useD?"線徑":"截面積"}為乙的 ${Aa} 倍,則甲:乙電阻比?`,sol:`R=ρL/A${useD?"(截面積∝直徑²)":""} → R甲/R乙=${la}/${den}=${(la/gcd(la,den))}:${(den/gcd(la,den))}`,opt:r.opt,ans:r.ans};}},
 {sub:"基本電學",topic:"電熱線剪並聯",make(){let V1,P1,k,V2,R,P2,g=0;do{V1=pick([100,200,110]);P1=pick([1000,2000,1100,500]);k=pick([2,3,4]);V2=pick([50,100,110,55]);R=V1*V1/P1;P2=V2*V2*k*k/R;g++;}while((R%1!==0||P2%1!==0)&&g<40);return {q:`額定 ${V1}V/${P1}W 的均勻電熱線,平均剪成 ${k} 段後全部並接到 ${V2}V 電源,總消耗功率?`,sol:`原R=V²/P=${V1}²/${P1}=${R}Ω;剪 ${k} 段每段 R/${k},並聯 ${k} 段後=R/${k*k};P=V²/(R/${k*k})=${V2}²×${k*k}/${R}=${P2}W`,...opts4(P2,[Math.round(V2*V2/R),Math.round(V2*V2*k/R),P1],"W")};}},
 {sub:"基本電學",topic:"色碼求電壓",make(){const s=pick([["棕黑紅",1000,0.1,10],["棕黑棕",100,1,10],["紅綠棕",250,0.4,10],["黃黑棕",400,0.25,10],["棕黑紅",1000,0.4,20],["棕黑棕",100,0.25,5]]);const c=s[0],R=s[1],P=s[2],V=s[3];return {q:`一電阻四色環前三碼為「${c}」,額定功率 ${P}W,最大工作電壓約?`,sol:`色碼 ${c} → R=${R}Ω;由 P=V²/R 得 V=√(P×R)=√(${P}×${R})=${V}V`,...opts4(V,[R,Math.round(P*R),Math.round(Math.sqrt(R))],"V")};}},
 {sub:"基本電學",topic:"導線拉長",make(){const V=pick([100,120,60,110]),I0=pick([8,12,16,20,4]),k=pick([2,3]),I=Math.round(I0/(k*k)*100)/100;return {q:`某電阻線在 ${V}V 下通過 ${I0}A;將它均勻拉長為原來 ${k} 倍(體積不變)後接相同電壓,電流變為?`,sol:`拉長 ${k} 倍→截面積變 1/${k}→電阻變 ${k*k} 倍→電流變 1/${k*k}:${I0}/${k*k}=${I}A`,...opts4(I,[Math.round(I0/k*100)/100,I0*k,I0],"A")};}},
 {sub:"基本電學",topic:"電池內阻",make(){let r,E,I1,I2,V1,V2,g=0;do{r=pick([1,2,3]);E=pick([12,18,24,20,15,30]);I1=pick([1,2,3]);I2=pick([4,5,6]);V1=E-I1*r;V2=E-I2*r;g++;}while((V2<=0||E%r!==0)&&g<50);const sc=E/r;return {q:`一電池供 ${I1}A 時端電壓 ${V1}V,供 ${I2}A 時端電壓 ${V2}V,求短路電流?`,sol:`端電壓=E−I·r。代入:${V1}=E−${I1}r、${V2}=E−${I2}r → 解得 r=${r}Ω、E=${E}V;短路電流=E/r=${E}/${r}=${sc}A`,...opts4(sc,[E,I2*2,Math.round(E/r/2)],"A")};}},
 {sub:"基本電學",topic:"燈泡串聯",make(){let Vt,a,bb,Va,g=0;do{Vt=pick([100,110,120]);a=pick([40,60,100]);bb=pick([40,60,100]);Va=Vt*bb/(a+bb);g++;}while((a===bb||Va%1!==0)&&g<40);return {q:`兩個額定 ${Vt}V 的燈泡 ${a}W 與 ${bb}W 串聯後接於 ${Vt}V 電源,${a}W 燈泡兩端電壓約?`,sol:`串聯電壓與電阻成正比、電阻與功率成反比;${a}W 燈分得 ${Vt}×(${bb}/(${a}+${bb}))=${Va}V`,...opts4(Va,[Math.round(Vt*a/(a+bb)),Vt/2,Vt],"V")};}},
 {sub:"基本電學",topic:"電壓降線徑",make(){let d1,d2,drop,nd,g=0;do{d1=pick([1.2,1.6,2.0]);d2=pick([1.6,2.0,2.6]);drop=pick([6,5,8,4]);nd=Math.round(drop*(d1/d2)*(d1/d2)*10)/10;g++;}while(d1>=d2&&g<30);return {q:`直徑 ${d1}mm 單芯線配線,線路電壓降為 ${drop}%;換成同材質同長度的 ${d2}mm 單芯線後,電壓降約?`,sol:`電壓降∝電阻∝1/截面積∝1/直徑²;新電壓降=${drop}%×(${d1}/${d2})²≈${nd}%`,...opts4(nd,[drop,Math.round(drop*(d2/d1)*10)/10,Math.round(drop/2*10)/10],"%")};}},
 {sub:"基本電學",topic:"電熱線功率比",make(){const dr=pick([2,3]),PA=pick([1000,900,800,1600,3600]),PB=Math.round(PA/(dr*dr));return {q:`兩電熱線長度相同、材質相同,甲的線徑為乙的 ${dr} 倍。接相同電壓下甲消耗 ${PA}W,則乙消耗?`,sol:`面積∝直徑²,甲面積為乙 ${dr*dr} 倍→甲電阻為乙的 1/${dr*dr};同電壓 P=V²/R,甲功率為乙 ${dr*dr} 倍→乙=${PA}/${dr*dr}=${PB}W`,...opts4(PB,[PA*dr*dr,Math.round(PA/dr),PA],"W")};}},
 {sub:"基本電學",topic:"電熱水器",make(){const m=pick([40,50,80,100]),dT=pick([40,50,60]),Pk=pick([2,3,4,5]),J=m*4200*dT,sec=Math.round(J/(Pk*1000)),tmin=Math.round(sec/60*10)/10;return {q:`${Pk}kW 電熱水器把 ${m} 公升水(${m}kg)溫度升高 ${dT}°C,約需幾分鐘?(水比熱 4200 J/kg°C)`,sol:`Q=mcΔT=${m}×4200×${dT}=${J} J;時間=Q/P=${J}/${Pk*1000}=${sec} 秒≈${tmin} 分`,...opts4(tmin,[sec,Math.round(tmin/2*10)/10,tmin*2]," 分")};}},
 {sub:"基本電學",topic:"惠斯登電橋",make(){let R1,R2,R3,Rx,g=0;do{R1=pick([2,4,5,10]);R2=pick([2,3,4,6]);R3=pick([10,20,30,60,12,24]);Rx=R2*R3/R1;g++;}while(Rx%1!==0&&g<40);return {q:`惠斯登電橋平衡,R1=${R1}Ω、R2=${R2}Ω、R3=${R3}Ω,對臂乘積相等,求待測 Rx?`,sol:`平衡:R1·Rx=R2·R3 → Rx=R2×R3/R1=${R2}×${R3}/${R1}=${Rx}Ω`,...opts4(Rx,[Math.round(R1*R3/R2),Math.round(R1*R2/R3),R2*R3],"Ω")};}},
 {sub:"基本電學",topic:"電容電荷",make(){const C=pick([10,20,47,100,4.7]),V=pick([5,10,12,20]),Q=Math.round(C*V*100)/100;return {q:`${C}µF 電容器接 ${V}V,儲存電荷?`,sol:`Q=C×V=${C}µF×${V}V=${Q}µC`,...opts4(Q,[Math.round(C/V*100)/100,C+V,Q*2]," µC")};}},
 {sub:"基本電學",topic:"電容儲能",make(){const C=pick([2,4,10,100]),V=pick([10,20,50,100]),W=0.5*C*V*V;return {q:`${C}µF 電容器兩端 ${V}V,儲存能量?`,sol:`W=½CV²=0.5×${C}×${V}²=${W}µJ`,...opts4(W,[C*V*V,0.5*C*V,C*V]," µJ")};}},
 {sub:"基本電學",topic:"混合電阻",make(){let R1,R2,R3,par,tot,g=0;do{R1=pick([2,3,4,5,6]);const p=pick([[3,6],[2,2],[4,4],[6,3],[10,10],[4,12]]);R2=p[0];R3=p[1];par=R2*R3/(R2+R3);tot=R1+par;g++;}while(tot%1!==0&&g<40);return {q:`R1=${R1}Ω 串聯(R2=${R2}Ω 並聯 R3=${R3}Ω),總電阻?`,sol:`並聯=(${R2}×${R3})/(${R2}+${R3})=${par}Ω;再串聯 R1:${R1}+${par}=${tot}Ω`,...opts4(tot,[R1+R2+R3,R1+R2,par],"Ω")};}},
 {sub:"基本電學",topic:"電池供電",make(){const n=pick([2,3,4,6]),R=pick([3,5,6,9,10]),V=n*1.5,I=Math.round(V/R*100)/100;return {q:`${n} 個 1.5V 電池串聯接一個 ${R}Ω 電阻(內阻忽略),電流約?`,sol:`總電壓=${n}×1.5=${V}V;I=V/R=${V}/${R}=${I}A`,...opts4(I,[V*R,V+R,Math.round(1.5/R*100)/100],"A")};}},
 {sub:"基本電學",topic:"電費計算",make(){const P=pick([500,1000,1500,2000,800]),h=pick([2,3,4,5]),price=pick([3,4,5]),kwh=P*h*30/1000,cost=Math.round(kwh*price);return {q:`${P}W 電器每天用 ${h} 小時,一個月 30 天、每度 ${price} 元,電費約?`,sol:`月用電=(${P}×${h}×30)/1000=${kwh} 度;電費=${kwh}×${price}=${cost} 元`,...opts4(cost,[Math.round(kwh),Math.round(P*h*price),cost*2]," 元")};}},
 {sub:"基本電學",topic:"分流器",make(){let Rm,n,Rs,g=0;do{Rm=pick([9,10,18,20,45,90]);n=pick([2,3,5,10]);Rs=Rm/(n-1);g++;}while(Rs%1!==0&&g<40);return {q:`電流表內阻 ${Rm}Ω,要把量程擴大為 ${n} 倍,需並聯的分流電阻?`,sol:`Rs=Rm/(n−1)=${Rm}/(${n}−1)=${Rs}Ω`,...opts4(Rs,[Rm*(n-1),Math.round(Rm/n*100)/100,Rm*n],"Ω")};}},
 {sub:"基本電學",topic:"溫度係數",make(){const R1=pick([100,200,50,10]),dT=pick([50,100,25]),R2=Math.round(R1*(1+0.004*dT)*100)/100;return {q:`銅線 20°C 時電阻 ${R1}Ω,溫度係數 0.004/°C,溫度再升 ${dT}°C 後電阻約?`,sol:`R₂=R₁(1+α·ΔT)=${R1}×(1+0.004×${dT})=${R2}Ω`,...opts4(R2,[Math.round(R1*(1-0.004*dT)*100)/100,R1,Math.round(R1*0.004*dT*100)/100],"Ω")};}},
 {sub:"電子學",topic:"集極電壓",make(){let Vcc,Ic,Rc,Vc,g=0;do{Vcc=pick([10,12,15,20]);Ic=pick([1,2,3,4]);Rc=pick([1,2,3]);Vc=Vcc-Ic*Rc;g++;}while(Vc<1&&g<30);return {q:`共射極放大器 Vcc=${Vcc}V、Ic=${Ic}mA、集極電阻 Rc=${Rc}kΩ,集極電壓 Vc?`,sol:`Vc=Vcc−Ic×Rc=${Vcc}−${Ic}×${Rc}=${Vc}V(mA×kΩ=V)`,...opts4(Vc,[Vcc,Ic*Rc,Vcc+Ic*Rc],"V")};}},
 {sub:"電工機械",topic:"變壓器電流",make(){const pr=pick([[100,50,4],[200,100,3],[110,220,6],[120,60,5],[240,120,2]]),V1=pr[0],V2=pr[1],I1=pr[2],I2=Math.round(I1*V1/V2*100)/100;return {q:`理想變壓器一次 ${V1}V/${I1}A,二次 ${V2}V,二次電流 I2?`,sol:`理想變壓器 V1·I1=V2·I2 → I2=I1×V1/V2=${I1}×${V1}/${V2}=${I2}A`,...opts4(I2,[Math.round(I1*V2/V1*100)/100,I1,I1*2],"A")};}},

 "電阻比較":{concept:"導線電阻 R=ρL/A:長度越長電阻越大、截面積越大電阻越小。注意『線徑』要先平方變成截面積(A∝直徑²)。",mnemonic:"電阻比 = 長度比 ÷ 截面積比;給線徑就先平方。",trap:"看到『線徑幾倍』別直接用,要平方變成面積幾倍。"},

 "邏輯閘運算":{concept:"邏輯閘依規則把 0/1 變輸出:AND 全 1 才 1、OR 有 1 就 1、NAND/NOR 是它們相反、XOR 兩個不同才 1。",mnemonic:"AND 要到齊、OR 來一個、N 開頭再反一次、XOR 不同為 1。",trap:"NAND=先 AND 再反、NOR=先 OR 再反,別忘了最後那一反。"}
};
function teachLines(q){
  const t=TEACH[q.topic]||{}; let h="";
  if(t.concept) h+=`<div style="margin-bottom:8px"><b style="color:var(--blue)">觀念</b>　${t.concept}</div>`;
  h+=`<div><b style="color:var(--blue)">算法</b>　${q.sol}</div>`;
  if(t.mnemonic) h+=`<div style="margin-top:8px"><b style="color:var(--amber-d)">口訣</b>　${t.mnemonic}</div>`;
  if(t.trap) h+=`<div style="margin-top:8px"><b style="color:var(--red)">小心</b>　${t.trap}</div>`;
  return h;
}
function buildQuestions(sel,n){
  const gens=GEN.filter(g=>!sel||g.sub===sel);
  const statics=shuffleArr(state.quiz.filter(q=>!sel||q.sub===sel));
  const out=[],usedS=new Set(),usedT=new Set();
  for(let k=0;k<n;k++){
    const staticLeft=statics.some(s=>!usedS.has(s.id));
    const useGen=gens.length && (Math.random()<0.72 || !staticLeft);
    if(useGen){ let qy,gd=0; do{qy=makeGen(pick(gens));gd++;}while(usedT.has(qy.q+(qy.opt?qy.opt.join("¦"):""))&&gd<10); usedT.add(qy.q+(qy.opt?qy.opt.join("¦"):"")); out.push(qy); }
    else{ const s=statics.find(q=>!usedS.has(q.id)); if(!s){ if(gens.length){out.push(makeGen(pick(gens)));continue;} else break; } usedS.add(s.id); out.push({key:s.id,statRef:s.id,sub:s.sub,topic:s.topic||"",q:s.q,opt:s.opt,ans:s.ans,sol:s.sol,gen:false}); }
  }
  return out;
}
function buildExam(subs,n){
  const inS=s=>!subs||subs.includes(s);
  const gens=GEN.filter(g=>inS(g.sub));
  const statics=shuffleArr(state.quiz.filter(q=>inS(q.sub)));
  const out=[],usedS=new Set(),usedT=new Set();
  for(let k=0;k<n;k++){
    const staticLeft=statics.some(s=>!usedS.has(s.id));
    const useGen=gens.length && (Math.random()<0.55 || !staticLeft);
    if(useGen){ let qy,gd=0; do{qy=makeGen(pick(gens));gd++;}while(usedT.has(qy.q+(qy.opt?qy.opt.join("¦"):""))&&gd<12); usedT.add(qy.q+(qy.opt?qy.opt.join("¦"):"")); out.push(qy); }
    else{ const s=statics.find(q=>!usedS.has(q.id)); if(!s){ if(gens.length){out.push(makeGen(pick(gens)));continue;} else break; } usedS.add(s.id); out.push({key:s.id,statRef:s.id,sub:s.sub,topic:s.topic||"",q:s.q,opt:s.opt,ans:s.ans,sol:s.sol,gen:false}); }
  }
  return out;
}

/* ---------- state ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function defaultState(){
  return {
    examDate:"2027-04-24", target:45,
    streak:0, lastActive:null, totalMin:0, weekMin:0, weekStart:todayStr(),
    today:{date:todayStr(), g1:false,g2:false,g3:false, min:0},
    cards:SEED_CARDS.map((c,i)=>({id:"c"+i,sub:c[0],q:c[1],a:c[2],mn:c[3],box:1,due:todayStr()})),
    quiz:SEED_QUIZ.map((q,i)=>({id:"q"+i,sub:q[0],q:q[1],opt:q[2],ans:q[3],sol:q[4],seen:0,ok:0})),
    wrong:[], mockHistory:[]
  };
}
let state;
function mergeSeed(){
  const haveC=new Set(state.cards.map(c=>c.id));
  SEED_CARDS.forEach((c,i)=>{ const id="c"+i; if(!haveC.has(id)) state.cards.push({id,sub:c[0],q:c[1],a:c[2],mn:c[3],box:1,due:todayStr()}); });
  const haveQ=new Set(state.quiz.map(q=>q.id));
  SEED_QUIZ.forEach((q,i)=>{ const id="q"+i; if(!haveQ.has(id)) state.quiz.push({id,sub:q[0],q:q[1],opt:q[2],ans:q[3],sol:q[4],seen:0,ok:0}); });
}
(function init(){
  const raw=loadRaw();
  state = raw ? JSON.parse(raw) : defaultState();
  mergeSeed();
  state.mockHistory=state.mockHistory||[];
  state.wrong=(state.wrong||[]).map(w=> typeof w==="string" ? (()=>{const s=state.quiz.find(x=>x.id===w); return s?{key:s.id,sub:s.sub,topic:s.topic||"",q:s.q,opt:s.opt,ans:s.ans,sol:s.sol}:null;})() : w ).filter(Boolean);
  if(state.examDate==="2027-05-02") state.examDate="2027-04-24"; // update old default to 116 estimate
  rolloverDay();
})();
function rolloverDay(){
  const t=todayStr();
  if(state.today.date!==t){
    // streak logic
    const done = state.today.g1&&state.today.g2&&state.today.g3;
    if(done){ state.lastActive=state.today.date; }
    // if yesterday not fully done and gap, streak handled on completion; reset today
    state.today={date:t, g1:false,g2:false,g3:false, min:0};
  }
  // weekly minutes reset every 7 days
  if(!state.weekStart) state.weekStart=t;
  if(daysBetween(state.weekStart,t)>=7){ state.weekMin=0; state.weekStart=t; }
  save();
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
let view="today";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function daysLeft(){ const d=daysBetween(todayStr(),state.examDate); return d; }
function subMastery(sub){
  const cs=state.cards.filter(c=>c.sub===sub);
  const qs=state.quiz.filter(q=>q.sub===sub && q.seen>0);
  let boxScore = cs.length? cs.reduce((s,c)=>s+(c.box-1),0)/(cs.length*4) : null; // 0..1
  let qScore = qs.length? qs.reduce((s,q)=>s+q.ok/q.seen,0)/qs.length : null;
  let parts=[boxScore,qScore].filter(x=>x!==null);
  if(!parts.length) return 0;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
function dueCards(sub){
  let list=state.cards.filter(c=>!sub||c.sub===sub);
  const t=todayStr();
  list.sort((a,b)=> (a.due<=t?0:1)-(b.due<=t?0:1) || a.box-b.box);
  return list;
}

/* ---------- render ---------- */
function setView(v){ view=v; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); render(); window.scrollTo(0,0); }
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));

function render(){
  $("#daysLeft").textContent = daysLeft()>=0?daysLeft():"–";
  if(view==="today") return renderToday();
  if(view==="cards") return renderCards();
  if(view==="quiz") return renderQuiz();
  if(view==="wrong") return renderWrong();
  if(view==="mock") return renderMock();
  if(view==="more") return renderMore();
}

/* timer */
let timer={running:false, sec:0, h:null};
function toggleTimer(){
  if(timer.running){ clearInterval(timer.h); timer.running=false; }
  else { timer.running=true; timer.h=setInterval(()=>{timer.sec++; updTimerDisp();},1000); }
  if(view==="today") $("#tbtn").outerHTML=`<button class="btn ${timer.running?'':'amber'} sm" id="tbtn">${timer.running?'暫停':'開始計時'}</button>`, $("#tbtn").addEventListener("click",toggleTimer);
}
function updTimerDisp(){ const el=$("#tdisp"); if(!el)return; const m=String(Math.floor(timer.sec/60)).padStart(2,"0"),s=String(timer.sec%60).padStart(2,"0"); el.textContent=m+":"+s; }
function stopTimer(){
  clearInterval(timer.h); timer.running=false;
  const mins=Math.round(timer.sec/60);
  if(mins>0){ state.today.min+=mins; state.totalMin+=mins; state.weekMin+=mins; save(); toast("記錄 +"+mins+" 分鐘 👍"); }
  timer.sec=0; render();
}

function addDays(box){ const iv=[0,1,2,4,7,15][box]||1; const d=new Date(); d.setDate(d.getDate()+iv); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function bar(lab,pct){ return `<div class="prog"><div class="lab"><span>${lab}</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`; }

  }
  if(quizSess.i>=quizSess.list.length){
    const n=quizSess.list.length, ok=quizSess.correctCount, sel=quizSess.sel;
    quizSess=null;
    state.today.g2=true; bumpStreak(); save();
    app.innerHTML=`<div class="card celebrate"><span class="big-emoji">✏️</span><h2>做完了!</h2><p style="color:var(--sub);margin-top:6px">答對 ${ok} / ${n} 題。答錯的已放進錯題本。</p>

      <button class="btn amber sm" id="more12" style="margin-top:10px">意猶未盡,再加練 20 題</button></div>`;
    $("#toWrong").addEventListener("click",()=>setView("wrong"));
    $("#more12").addEventListener("click",()=>{ const list=buildQuestions(sel,20); quizSess={list,i:0,answered:false,correctCount:0,sel}; renderQuiz(); });
    return;
  }
  const q=quizSess.list[quizSess.i];
  app.innerHTML=`
    <div class="hint">${quizSess.i+1} / ${quizSess.list.length}${q.gen?'　·　自動出題':''}</div>
    <div class="card">
      <span class="tag" style="font-size:11px;font-weight:700;color:var(--blue);background:#eaf0ff;padding:3px 9px;border-radius:999px">${q.sub}${q.topic?'・'+q.topic:''}</span>
      <div style="font-size:17.5px;font-weight:700;margin-top:10px">${q.q}</div>
      <div id="opts">${q.opt.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
      <div id="solveBox"></div>
      <div id="qbtns"></div>
    </div>`;
  quizSess.answered=false;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(quizSess.answered)return; quizSess.answered=true;
    const pk=+b.dataset.i, correct=q.ans;
    if(q.statRef){ const rec=state.quiz.find(x=>x.id===q.statRef); if(rec){rec.seen++; if(pk===correct)rec.ok++;} }
    document.querySelectorAll(".opt").forEach((o,i)=>{ if(i===correct)o.classList.add("correct"); if(i===pk&&pk!==correct)o.classList.add("wrong"); });
    if(pk===correct){ quizSess.correctCount++; removeWrong(q.key); toast("答對 ✓"); }
    else { addWrong(q); }
    $("#solveBox").innerHTML = pk===correct
      ? `<div class="solve"><b style="color:var(--green)">答對!</b>　${q.sol}</div>`
      : `<div class="solve" style="border-left:4px solid var(--red)"><div style="margin-bottom:8px"><b style="color:var(--red)">正解 ${"ABCD"[correct]}. ${q.opt[correct]}</b></div>${teachLines(q)}</div>`;
    const hasGen=GEN.some(g=>g.topic===q.topic);
    $("#qbtns").innerHTML=(pk!==correct&&hasGen?`<button class="btn amber sm" id="drill" style="margin-top:12px">同類再一題(換數字)</button>`:``)+`<button class="btn" id="nextQ" style="margin-top:10px">下一題 →</button>`;
    if(pk!==correct&&hasGen){ $("#drill").addEventListener("click",()=>{ const g=GEN.find(x=>x.topic===q.topic); quizSess.list.splice(quizSess.i+1,0,makeGen(g)); quizSess.i++; renderQuiz(); }); }
    $("#nextQ").addEventListener("click",()=>{ quizSess.i++; renderQuiz(); });
    save();
  }));
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function addWrong(q){ const key=q.key||q.id; if(!state.wrong.some(w=>w.key===key)) state.wrong.push({key,sub:q.sub,topic:q.topic||"",q:q.q,opt:q.opt,ans:q.ans,sol:q.sol}); }
function removeWrong(key){ state.wrong=state.wrong.filter(w=>w.key!==key); }

    wrongSess=null; state.today.g3=true; bumpStreak(); save();
    app.innerHTML=`<div class="card celebrate"><span class="big-emoji">⚡</span><h2>三關全清!</h2><p style="color:var(--sub);margin-top:6px">今天充飽電了,連續 ${state.streak} 天 🔥</p><button class="btn" id="home" style="margin-top:16px">回今天</button></div>`;
    $("#home").addEventListener("click",()=>setView("today"));
    return;
  }
  const q=wrongSess.items[wrongSess.i];
  if(!q){ wrongSess.i++; return renderWrong(); }
  app.innerHTML=`
    <div class="hint">錯題複習　${wrongSess.i+1} / ${wrongSess.items.length}</div>
    <div class="card">
      <span class="tag" style="font-size:11px;font-weight:700;color:var(--red);background:#fdece8;padding:3px 9px;border-radius:999px">${q.sub}${q.topic?'・'+q.topic:''}</span>

      <div id="opts">${q.opt.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
      <div id="solveBox"></div>
      <button class="btn hidden" id="nextW" style="margin-top:14px">下一題 →</button>
    </div>`;
  let answered=false;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(answered)return; answered=true;
    const pk=+b.dataset.i, correct=q.ans;
    document.querySelectorAll(".opt").forEach((o,i)=>{ if(i===correct)o.classList.add("correct"); if(i===pk&&pk!==correct)o.classList.add("wrong"); });
    if(pk===correct){ removeWrong(q.key); toast("答對,移出錯題本 ✓"); }
    else { toast("再記一次正解"); }
    $("#solveBox").innerHTML = pk===correct
      ? `<div class="solve"><b style="color:var(--green)">答對,移出錯題本!</b>　${q.sol}</div>`
      : `<div class="solve" style="border-left:4px solid var(--red)"><div style="margin-bottom:8px"><b style="color:var(--red)">正解 ${"ABCD"[correct]}. ${q.opt[correct]}</b></div>${teachLines(q)}</div>`;
    $("#nextW").classList.remove("hidden"); save();
  }));
  $("#nextW").addEventListener("click",()=>{ wrongSess.i++; renderWrong(); });
}

}

function submitMock(){
  if(!mockSess||mockSess.submitted)return;
  clearInterval(mockSess.timerH); mockSess.submitted=true;
  const ms=mockSess; let correct=0;
  ms.questions.forEach((q,i)=>{ if(ms.answers[i]===q.ans)correct++; });

  state.mockHistory=state.mockHistory||[];
  state.mockHistory.push({date:todayStr(),scope:ms.scope,score:ms.score,correct,total:ms.total});
  save();
  if(view==="mock") renderMock(); else setView("mock");
}

/* ===== 批次匯入考古題 ===== */
function letterToIdx(ch){const m={A:0,B:1,C:2,D:3,a:0,b:1,c:2,d:3,"Ａ":0,"Ｂ":1,"Ｃ":2,"Ｄ":3};return m[ch];}
function parseWholePaper(text,ansText,sub){
  const out=[]; let skipped=0;
  // answer map: number -> letter, or ordered letter list
  const numAns={}; let ordered=[];
  const pairRe=/(\d{1,3})\s*[\.\、．:：\)）]?\s*([A-DＡ-Ｄ])/g; let mm, hasNum=false;
  while((mm=pairRe.exec(ansText))){ numAns[mm[1]]=mm[2]; hasNum=true; }
  if(!hasNum){ ordered=(ansText.match(/[A-DＡ-Ｄ]/g)||[]); }
  // split into question blocks by leading number
  const blocks=text.split(/(?=(?:^|\n)\s*(?:[\(（][\s　]*[\)）]\s*)?\d{1,3}\s*[\.\、．])/);
  let orderIdx=0;
  blocks.forEach(bk=>{
    const raw=bk.trim(); if(!raw)return;
    const head=raw.match(/^\s*(?:[\(（][\s　]*[\)）]\s*)?(\d{1,3})\s*[\.\、．]\s*/);
    if(!head){ return; }
    const num=head[1]; let body=raw.slice(head[0].length);
    // find option markers (A)(B)(C)(D)
    const markRe=/[\(（]\s*([A-DＡ-Ｄ])\s*[\)）]/g; const marks=[]; let m2;
    while((m2=markRe.exec(body))){ marks.push({i:m2.index,end:markRe.lastIndex,L:m2[1]}); }
    if(marks.length<4){ skipped++; return; }
    const stem=body.slice(0,marks[0].i).replace(/\s+/g," ").trim();
    const opts=[];
    for(let k=0;k<4;k++){ const seg=body.slice(marks[k].end,(k<marks.length-1?marks[k+1].i:body.length)); opts.push(seg.replace(/\s+/g," ").replace(/[。\.]\s*$/,"").trim()); }
    if(!stem||opts.some(o=>!o)){ skipped++; return; }
    let ansL = hasNum ? numAns[num] : ordered[orderIdx];
    orderIdx++;
    const ans=letterToIdx(ansL);
    if(ans===undefined){ skipped++; return; }
    out.push({id:"imp"+Date.now()+"_"+num+"_"+Math.random().toString(36).slice(2,6),sub,topic:"考古題",q:stem,opt:opts,ans,sol:"(匯入考古題)",seen:0,ok:0});
  });
  return {out,skipped};
}

2. 矽二極體順向導通壓降約多少? (A)0V (B)0.3V (C)0.7V (D)5V
3. 變壓器一次 200 匝、二次 50 匝,一次 100V,二次電壓? (A)400V (B)25V (C)50V (D)100V`;

/* ===== streak ===== */
function bumpStreak(){
  const all=state.today.g1&&state.today.g2&&state.today.g3;
  if(all && state.lastActive!==state.today.date){
    const gap = state.lastActive? daysBetween(state.lastActive,state.today.date):1;
    state.streak = (gap===1)? state.streak+1 : 1;
    state.lastActive=state.today.date;
  }
}
