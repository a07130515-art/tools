<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>充電站・統測電機類每日練習</title>
<style>
:root{
  --bg:#eef1f8; --card:#ffffff; --ink:#182338; --sub:#5c667d;
  --line:#e3e7f1; --blue:#2f6be6; --blue-d:#1f4fbf;
  --amber:#f6a62b; --amber-d:#d98407;
  --green:#12a05f; --red:#e5533c;
  --shadow:0 6px 22px rgba(24,35,56,.08);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:84px;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 0}
h1,h2,h3,p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.5px}
.spark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#5b8bff);display:grid;place-items:center;color:#fff;font-size:15px}
.count{background:var(--card);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);text-align:center;line-height:1.15}
.count b{font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.count span{display:block;font-size:11px;color:var(--sub)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--sub);text-transform:uppercase}

/* battery signature */
.batt-wrap{display:flex;align-items:center;gap:16px;margin:6px 0 4px}
.batt{position:relative;width:96px;height:150px;border:5px solid var(--ink);border-radius:14px;overflow:hidden;flex:0 0 auto;background:#f3f5fb}
.batt::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:34px;height:11px;background:var(--ink);border-radius:5px 5px 0 0}
.seg{position:absolute;left:0;right:0;transition:background .5s, box-shadow .5s;background:#e7ebf5;border-top:3px solid #f3f5fb}
.seg.on{background:linear-gradient(180deg,#ffcf6e,var(--amber));box-shadow:inset 0 0 18px rgba(217,132,7,.35)}
.seg.s3{top:0;height:33.4%}.seg.s2{top:33.4%;height:33.3%}.seg.s1{top:66.7%;height:33.3%}
.batt-txt h2{font-size:22px}
.batt-txt .pct{font-size:40px;font-weight:800;color:var(--amber-d);font-variant-numeric:tabular-nums;line-height:1}
.batt-txt p{font-size:13px;color:var(--sub);margin-top:4px}

/* gates */
.gate{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-top:10px;width:100%;text-align:left;transition:.15s;background:var(--card)}
.gate:active{transform:scale(.99)}
.gate .num{width:30px;height:30px;border-radius:9px;background:#eaf0ff;color:var(--blue);font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.gate .g-body{flex:1}
.gate .g-body b{font-size:15.5px}
.gate .g-body span{display:block;font-size:12.5px;color:var(--sub)}
.gate .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px}
.gate.done{border-color:#bfe6d1;background:#f2fbf6}
.gate.done .tick{background:var(--green);border-color:var(--green)}
.gate.done .num{background:#e3f6ec;color:var(--green)}

/* mini stat row */
.mini{display:flex;gap:10px;margin-bottom:14px}
.mini .m{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}
.mini .m b{font-size:22px;font-variant-numeric:tabular-nums}
.mini .m span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}

/* timer */
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .disp{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* buttons */
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:14px;text-align:center;box-shadow:0 6px 16px rgba(47,107,230,.28)}
.btn:active{background:var(--blue-d)}
.btn.amber{background:var(--amber);box-shadow:0 6px 16px rgba(246,166,43,.3)}
.btn.amber:active{background:var(--amber-d)}
.btn.ghost{background:#eef2fb;color:var(--blue);box-shadow:none}
.btn.sm{font-size:14px;padding:11px}

/* flashcard */
.flip{perspective:1200px;margin-bottom:14px}
.flip-inner{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face .tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;color:var(--blue);background:#eaf0ff;padding:3px 9px;border-radius:999px}
.face .q{font-size:21px;font-weight:700}
.face.back{transform:rotateY(180deg);background:#fbfcff}
.face.back .a{font-size:22px;font-weight:800;color:var(--ink)}
.face.back .mn{margin-top:12px;font-size:14px;color:var(--amber-d);background:#fff6e6;padding:9px 12px;border-radius:12px;display:inline-block}
.hint{text-align:center;font-size:12.5px;color:var(--sub);margin:-4px 0 12px}
.rowbtn{display:flex;gap:10px}
.rowbtn .btn{flex:1}
.btn.no{background:#fdece8;color:var(--red);box-shadow:none}
.btn.yes{background:#e5f7ee;color:var(--green);box-shadow:none}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:10px;font-size:15.5px;transition:.12s}
.opt:active{transform:scale(.995)}
.opt .k{font-weight:800;color:var(--blue);margin-right:8px}
.opt.correct{border-color:var(--green);background:#f0fbf5}
.opt.wrong{border-color:var(--red);background:#fdf0ee}
.opt.correct .k{color:var(--green)}.opt.wrong .k{color:var(--red)}
.solve{background:#f4f7ff;border-radius:13px;padding:13px 15px;margin-top:12px;font-size:14px}
.solve b{color:var(--blue)}

/* progress bars */
.prog{margin-top:12px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.prog .lab span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:9px;background:#e9edf7;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6a9bff);border-radius:999px;transition:width .4s}

/* selects / inputs */
label.fld{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 5px}
select,input,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--sub)}
.pill.sel{background:var(--blue);color:#fff;border-color:var(--blue)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--sub);font-weight:600}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--blue)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}
.big-emoji{font-size:40px;display:block;margin-bottom:8px}
.celebrate{text-align:center;padding:10px 0}
.celebrate .big-emoji{font-size:52px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:40;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.sec-title{font-size:17px;font-weight:800;margin:4px 2px 10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="spark">⚡</span>充電站</div>
    <div class="count"><b id="daysLeft">–</b><span>天後統測</span></div>
  </div>
  <div id="app"></div>
</div>

<div class="nav">
  <button data-v="today" class="on"><span class="ic">🔋</span>今天</button>
  <button data-v="cards"><span class="ic">🗂️</span>記憶卡</button>
  <button data-v="quiz"><span class="ic">✏️</span>練習</button>
  <button data-v="wrong"><span class="ic">🔁</span>錯題</button>
  <button data-v="more"><span class="ic">⚙️</span>更多</button>
</div>
<div class="toast" id="toast"></div>

function currentPlan(){
  const ym=todayStr().slice(0,7);
  let idx=PLAN.findIndex(p=>p[0]===ym);
  let soon=false;

}

/* ---------- state ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function defaultState(){
  return {
    examDate:"2027-04-24", target:45,
    streak:0, lastActive:null, totalMin:0, weekMin:0, weekStart:todayStr(),
    today:{date:todayStr(), g1:false,g2:false,g3:false, min:0},
    cards:SEED_CARDS.map((c,i)=>({id:"c"+i,sub:c[0],q:c[1],a:c[2],mn:c[3],box:1,due:todayStr()})),
    quiz:SEED_QUIZ.map((q,i)=>({id:"q"+i,sub:q[0],q:q[1],opt:q[2],ans:q[3],sol:q[4],seen:0,ok:0})),
    wrong:[]
  };
}
let state;
function mergeSeed(){
  const haveC=new Set(state.cards.map(c=>c.id));
  SEED_CARDS.forEach((c,i)=>{ const id="c"+i; if(!haveC.has(id)) state.cards.push({id,sub:c[0],q:c[1],a:c[2],mn:c[3],box:1,due:todayStr()}); });
  const haveQ=new Set(state.quiz.map(q=>q.id));
  SEED_QUIZ.forEach((q,i)=>{ const id="q"+i; if(!haveQ.has(id)) state.quiz.push({id,sub:q[0],q:q[1],opt:q[2],ans:q[3],sol:q[4],seen:0,ok:0}); });
}
(function init(){
  const raw=loadRaw();
  state = raw ? JSON.parse(raw) : defaultState();
  mergeSeed();
  if(state.examDate==="2027-05-02") state.examDate="2027-04-24"; // update old default to 116 estimate
  rolloverDay();
})();
function rolloverDay(){
  const t=todayStr();
  if(state.today.date!==t){
    // streak logic
    const done = state.today.g1&&state.today.g2&&state.today.g3;
    if(done){ state.lastActive=state.today.date; }
    // if yesterday not fully done and gap, streak handled on completion; reset today
    state.today={date:t, g1:false,g2:false,g3:false, min:0};
  }
  // weekly minutes reset every 7 days
  if(!state.weekStart) state.weekStart=t;
  if(daysBetween(state.weekStart,t)>=7){ state.weekMin=0; state.weekStart=t; }
  save();
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
let view="today";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function daysLeft(){ const d=daysBetween(todayStr(),state.examDate); return d; }
function subMastery(sub){
  const cs=state.cards.filter(c=>c.sub===sub);
  const qs=state.quiz.filter(q=>q.sub===sub && q.seen>0);
  let boxScore = cs.length? cs.reduce((s,c)=>s+(c.box-1),0)/(cs.length*4) : null; // 0..1
  let qScore = qs.length? qs.reduce((s,q)=>s+q.ok/q.seen,0)/qs.length : null;
  let parts=[boxScore,qScore].filter(x=>x!==null);
  if(!parts.length) return 0;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
function dueCards(sub){
  let list=state.cards.filter(c=>!sub||c.sub===sub);
  const t=todayStr();
  list.sort((a,b)=> (a.due<=t?0:1)-(b.due<=t?0:1) || a.box-b.box);
  return list;
}

/* ---------- render ---------- */
function setView(v){ view=v; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); render(); window.scrollTo(0,0); }

function render(){

  if(view==="wrong") return renderWrong();

}

/* timer */
let timer={running:false, sec:0, h:null};
function toggleTimer(){
  if(timer.running){ clearInterval(timer.h); timer.running=false; }
  else { timer.running=true; timer.h=setInterval(()=>{timer.sec++; updTimerDisp();},1000); }
  if(view==="today") $("#tbtn").outerHTML=`<button class="btn ${timer.running?'':'amber'} sm" id="tbtn">${timer.running?'暫停':'開始計時'}</button>`, $("#tbtn").addEventListener("click",toggleTimer);
}
function updTimerDisp(){ const el=$("#tdisp"); if(!el)return; const m=String(Math.floor(timer.sec/60)).padStart(2,"0"),s=String(timer.sec%60).padStart(2,"0"); el.textContent=m+":"+s; }
function stopTimer(){
  clearInterval(timer.h); timer.running=false;
  const mins=Math.round(timer.sec/60);
  if(mins>0){ state.today.min+=mins; state.totalMin+=mins; state.weekMin+=mins; save(); toast("記錄 +"+mins+" 分鐘 👍"); }
  timer.sec=0; render();
}

      <div id="opts">${q.opt.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
      <div id="solveBox"></div>
      <button class="btn hidden" id="nextQ" style="margin-top:14px">下一題 →</button>
    </div>`;
  quizSess.answered=false;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(quizSess.answered)return; quizSess.answered=true;
    const pick=+b.dataset.i, correct=q.ans;
    const rec=state.quiz.find(x=>x.id===q.id); if(rec){rec.seen++; if(pick===correct)rec.ok++;}
    document.querySelectorAll(".opt").forEach((o,i)=>{ if(i===correct)o.classList.add("correct"); if(i===pick&&pick!==correct)o.classList.add("wrong"); });
    if(pick===correct){ quizSess.correctCount++; removeWrong(q.id); toast("答對 ✓"); }
    else { addWrong(q.id); }
    $("#solveBox").innerHTML=`<div class="solve"><b>${pick===correct?'正確!':'正解 '+"ABCD"[correct]}</b>　${q.sol}</div>`;
    $("#nextQ").classList.remove("hidden");
    save();
  }));
  $("#nextQ").addEventListener("click",()=>{ quizSess.i++; renderQuiz(); });
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function addWrong(id){ if(!state.wrong.includes(id))state.wrong.push(id); }
function removeWrong(id){ state.wrong=state.wrong.filter(x=>x!==id); }

/* ===== WRONG book ===== */
let wrongSess=null;
function renderWrong(){
  if(wrongSess){ return renderWrongSess(); }
  if(!state.wrong.length){
    app.innerHTML=`<div class="card"><div class="empty"><span class="big-emoji">🎯</span>錯題本是空的<br>做練習答錯的題目會自動收進來,<br>複習到答對就會移除。
      <button class="btn ghost sm" id="markG3" style="margin-top:16px">今天沒有錯題,完成第 3 關</button></div></div>`;
    $("#markG3").addEventListener("click",()=>{ state.today.g3=true; bumpStreak(); save(); toast("第 3 關完成 ✓"); setView("today"); });
    return;
  }
  app.innerHTML=`
    <div class="sec-title">錯題本・${state.wrong.length} 題</div>
    <div class="card">
      <p style="color:var(--sub);font-size:14px">把答錯的題目重做一遍,答對就移除。全部清完就滿電了。</p>
      <button class="btn amber" id="startWrong" style="margin-top:14px">開始複習</button>
    </div>`;
  $("#startWrong").addEventListener("click",()=>{ wrongSess={ids:state.wrong.slice(),i:0}; renderWrong(); });
}
function renderWrongSess(){
  if(wrongSess.i>=wrongSess.ids.length){
    wrongSess=null; state.today.g3=true; bumpStreak(); save();
    app.innerHTML=`<div class="card celebrate"><span class="big-emoji">⚡</span><h2>三關全清!</h2><p style="color:var(--sub);margin-top:6px">今天充飽電了,連續 ${state.streak} 天 🔥</p><button class="btn" id="home" style="margin-top:16px">回今天</button></div>`;
    $("#home").addEventListener("click",()=>setView("today"));
    return;
  }
  const id=wrongSess.ids[wrongSess.i];
  const q=state.quiz.find(x=>x.id===id);
  if(!q){ wrongSess.i++; return renderWrong(); }
  app.innerHTML=`
    <div class="hint">錯題複習　${wrongSess.i+1} / ${wrongSess.ids.length}</div>
    <div class="card">
      <span class="tag" style="font-size:11px;font-weight:700;color:var(--red);background:#fdece8;padding:3px 9px;border-radius:999px">${q.sub}</span>
      <div style="font-size:17.5px;font-weight:700;margin-top:10px">${q.q}</div>
      <div id="opts">${q.opt.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
      <div id="solveBox"></div>
      <button class="btn hidden" id="nextW" style="margin-top:14px">下一題 →</button>
    </div>`;
  let answered=false;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(answered)return; answered=true;
    const pick=+b.dataset.i, correct=q.ans;
    document.querySelectorAll(".opt").forEach((o,i)=>{ if(i===correct)o.classList.add("correct"); if(i===pick&&pick!==correct)o.classList.add("wrong"); });
    if(pick===correct){ removeWrong(id); toast("答對,移出錯題本 ✓"); }
    else { toast("再記一次正解"); }
    $("#solveBox").innerHTML=`<div class="solve"><b>${pick===correct?'正確!':'正解 '+"ABCD"[correct]}</b>　${q.sol}</div>`;
    $("#nextW").classList.remove("hidden"); save();
  }));
  $("#nextW").addEventListener("click",()=>{ wrongSess.i++; renderWrong(); });
}

/* ===== ADD content ===== */
function showAddCard(){
  app.innerHTML=`
    <div class="sec-title">新增記憶卡</div>
    <div class="card">
      <label class="fld">科目</label>
      <select id="ac_sub">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
      <label class="fld">正面(問題)</label><textarea id="ac_q" placeholder="例:歐姆定律公式?"></textarea>
      <label class="fld">背面(答案)</label><textarea id="ac_a" placeholder="例:V = I × R"></textarea>
      <label class="fld">口訣(可留空)</label><input id="ac_mn" placeholder="例:V像老大">
      <button class="btn" id="ac_save" style="margin-top:16px">儲存卡片</button>
      <button class="btn ghost sm" id="ac_back" style="margin-top:10px">取消</button>
    </div>`;
  $("#ac_save").addEventListener("click",()=>{
    const q=$("#ac_q").value.trim(),a=$("#ac_a").value.trim();
    if(!q||!a){toast("正面和背面都要填");return;}
    state.cards.push({id:"c"+Date.now(),sub:$("#ac_sub").value,q,a,mn:$("#ac_mn").value.trim(),box:1,due:todayStr()});
    save(); toast("已加入 ✓"); renderCards();
  });
  $("#ac_back").addEventListener("click",()=>renderCards());
}
function showAddQuiz(){
  app.innerHTML=`
    <div class="sec-title">新增選擇題</div>
    <div class="card">
      <label class="fld">科目</label>
      <select id="aq_sub">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select>
      <label class="fld">題目</label><textarea id="aq_q"></textarea>
      <label class="fld">選項 A</label><input id="aq_a">
      <label class="fld">選項 B</label><input id="aq_b">
      <label class="fld">選項 C</label><input id="aq_c">
      <label class="fld">選項 D</label><input id="aq_d">
      <label class="fld">正解</label>
      <select id="aq_ans"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
      <label class="fld">解析(可留空)</label><textarea id="aq_sol"></textarea>
      <button class="btn" id="aq_save" style="margin-top:16px">儲存題目</button>
      <button class="btn ghost sm" id="aq_back" style="margin-top:10px">取消</button>
    </div>`;
  $("#aq_save").addEventListener("click",()=>{
    const q=$("#aq_q").value.trim(),opt=["a","b","c","d"].map(x=>$("#aq_"+x).value.trim());
    if(!q||opt.some(o=>!o)){toast("題目和四個選項都要填");return;}
    state.quiz.push({id:"q"+Date.now(),sub:$("#aq_sub").value,q,opt,ans:+$("#aq_ans").value,sol:$("#aq_sol").value.trim()||"(自訂題目)",seen:0,ok:0});
    save(); toast("已加入 ✓"); renderQuiz();
  });
  $("#aq_back").addEventListener("click",()=>renderQuiz());
}

/* ===== MORE / settings ===== */
function renderMore(){
  const cp=currentPlan();
  app.innerHTML=`
    <div class="sec-title">更多</div>
    <div class="card">
      <div class="eyebrow">8 個月讀書計畫</div>
      <div style="margin-top:10px">
        ${PLAN.map((p,i)=>`
          <div style="display:flex;gap:11px;padding:10px 0;border-bottom:${i<PLAN.length-1?'1px solid var(--line)':'none'}">
            <div style="flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12px;line-height:1.1;text-align:center;${i===cp.idx?'background:var(--amber);color:#fff':'background:#eef2fb;color:var(--sub)'}">${p[0].slice(5).replace(/^0/,'')}<br>月</div>
            <div style="flex:1">
              <b style="font-size:14.5px">${p[1]}</b>
              <p style="font-size:12.5px;color:var(--sub);margin-top:2px">${p[2]}</p>
            </div>
          </div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">考試設定</div>
      <label class="fld">統測日期</label><input type="date" id="exam" value="${state.examDate}">
      <label class="fld">每日目標(分鐘)</label>
      <select id="tgt"><option ${state.target==30?'selected':''}>30</option><option ${state.target==45?'selected':''}>45</option><option ${state.target==60?'selected':''}>60</option></select>
      <button class="btn sm" id="saveSet" style="margin-top:14px">儲存設定</button>
    </div>
    <div class="card">
      <div class="eyebrow">總覽</div>
      <div class="mini" style="margin:12px 0 0">
        <div class="m"><b>${state.cards.length}</b><span>記憶卡</span></div>
        <div class="m"><b>${state.quiz.length}</b><span>題目</span></div>
        <div class="m"><b>${state.totalMin}</b><span>累計分鐘</span></div>
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">備份・轉移</div>
      <p style="font-size:13.5px;color:var(--sub);margin:8px 0 12px">把進度存成一段文字備份;換手機或清資料前先複製起來。</p>
      <button class="btn ghost sm" id="exp">匯出備份(複製)</button>
      <button class="btn ghost sm" id="imp" style="margin-top:10px">貼上備份還原</button>
      <button class="btn ghost sm" id="rst" style="margin-top:10px;color:var(--red)">清除全部重來</button>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--sub);padding:6px 0 4px">內建題目為示範,可自行新增真正的考古題。<br>放在瀏覽器或自架網頁使用,進度會自動保存。</p>`;
  $("#saveSet").addEventListener("click",()=>{ state.examDate=$("#exam").value||state.examDate; state.target=+$("#tgt").value; save(); toast("已儲存 ✓"); render(); });
  $("#exp").addEventListener("click",()=>{ const s=JSON.stringify(state); navigator.clipboard?.writeText(s).then(()=>toast("已複製備份"),()=>prompt("複製這段文字:",s)); });
  $("#imp").addEventListener("click",()=>{ const s=prompt("貼上備份文字:"); if(!s)return; try{ state=JSON.parse(s); save(); toast("還原成功 ✓"); rolloverDay(); render(); }catch(e){ toast("格式不對,還原失敗"); } });
  $("#rst").addEventListener("click",()=>{ if(confirm("確定清除全部進度、回到最初?")){ state=defaultState(); save(); toast("已重置"); setView("today"); } });
}

/* ===== streak ===== */
function bumpStreak(){
  const all=state.today.g1&&state.today.g2&&state.today.g3;
  if(all && state.lastActive!==state.today.date){
    const gap = state.lastActive? daysBetween(state.lastActive,state.today.date):1;
    state.streak = (gap===1)? state.streak+1 : 1;
    state.lastActive=state.today.date;
  }
}

/* boot */
render();
</script>
